name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev,llm]"
      - name: Lint
        run: ruff check src tests
      - name: Tests
        # No ANTHROPIC_API_KEY here: LLM tests use a mocked client and live
        # tests are deselected (pytest.ini addopts = -m 'not live').
        run: pytest -q

  alphazero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU-only PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: AlphaZero tests
        run: pytest -q tests/test_alphazero.py
      - name: Tiny self-play training run
        run: mnk-bench train-alphazero --board 3,3,3 --iterations 2 --games 8 --simulations 16 --eval-games 4 --out /tmp/az

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Quick experiment suite + report
        run: |
          mnk-bench experiment --quick --out smoke-results
          mnk-bench replot --out smoke-results
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: smoke-results
